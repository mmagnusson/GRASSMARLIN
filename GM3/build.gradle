plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'gov.iad'
version = '3.2.1'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

// JavaFX configuration
javafx {
    version = '21.0.5'
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.web', 'javafx.swing', 'javafx.media']
}

dependencies {
    // Jakarta JAXB (XML binding) - updated from 3.0.x
    implementation 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.2'
    implementation 'org.glassfish.jaxb:jaxb-runtime:4.0.5'
    implementation 'jakarta.activation:jakarta.activation-api:2.1.3'

    // ANTLR 4 runtime - updated from 4.5
    implementation 'org.antlr:antlr4-runtime:4.13.2'

    // Apache Commons - updated from severely outdated versions
    // Commons IO: 2.4 -> 2.18.0 (fixes CVE-2024-47554, CVE-2021-29425)
    implementation 'commons-io:commons-io:2.18.0'
    // Commons Lang: 3.3.2 -> 3.17.0
    implementation 'org.apache.commons:commons-lang3:3.17.0'

    // Gson for JSON parsing (replaces custom JsonParser)
    implementation 'com.google.code.gson:gson:2.11.0'

    // Pcap4J (replaces abandoned JNetPcap)
    implementation 'org.pcap4j:pcap4j-core:1.8.2'
    implementation 'org.pcap4j:pcap4j-packetfactory-static:1.8.2'

    // SLF4J + Logback (for future logging migration)
    implementation 'org.slf4j:slf4j-api:2.0.16'
    runtimeOnly 'ch.qos.logback:logback-classic:1.5.12'

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets {
    main {
        java {
            srcDirs = ['src', 'generated-sources']
            exclude 'test/**'
        }
        resources {
            srcDirs = ['src']
            exclude '**/*.java'
            exclude 'test/**'
        }
    }
    test {
        java {
            srcDirs = ['src/test/java']
        }
        resources {
            srcDirs = ['src/test/resources']
        }
    }
}

test {
    useJUnitPlatform()
    // Headless JavaFX for CI compatibility
    jvmArgs += [
        '-Djava.awt.headless=true',
        '-Dtestfx.robot=glass',
        '-Dtestfx.headless=true',
        '-Dprism.order=sw',
        '-Dprism.text=t2k',
        '-Dglass.platform=Monocle',
        '-Dmonocle.platform=Headless'
    ]
}

application {
    mainClass = 'util.Launcher'
}

jar {
    manifest {
        attributes(
            'Main-Class': 'util.Launcher',
            'Permission': 'High'
        )
    }

    // Create a fat JAR (like the Ant build does)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    // Include resources
    from('resource/images') { into 'images' }
    from('resource/xsd') { into 'xsd' }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked']
}

// Plugin compilation — proper Gradle tasks instead of ant.javac
def pluginNames = ['iadgov.csvimport', 'iadgov.svgexport', 'iadgov.sessioneventtest']
def pluginJarTasks = []

pluginNames.each { pluginName ->
    def pluginSrcDir = file("data/plugins/${pluginName}")
    if (pluginSrcDir.exists()) {
        def compileTask = tasks.register("compile_${pluginName.replace('.', '_')}", JavaCompile) {
            description = "Compile plugin ${pluginName}"
            group = 'build'
            source = fileTree(pluginSrcDir)
            classpath = files(jar.archiveFile) + configurations.runtimeClasspath
            destinationDirectory = layout.buildDirectory.dir("plugin-classes/${pluginName}")
            sourceCompatibility = JavaVersion.VERSION_21
            targetCompatibility = JavaVersion.VERSION_21
            options.encoding = 'UTF-8'
            dependsOn jar
        }

        def jarTask = tasks.register("jar_${pluginName.replace('.', '_')}", Jar) {
            description = "Package plugin ${pluginName}"
            group = 'build'
            archiveFileName = "${pluginName}.jar"
            destinationDirectory = layout.buildDirectory.dir('plugins')
            from compileTask.map { it.destinationDirectory }
            dependsOn compileTask
        }

        pluginJarTasks.add(jarTask)
    }
}

tasks.register('buildPlugins') {
    description = 'Build all plugin JARs'
    group = 'build'
    dependsOn pluginJarTasks
}

// Distribution task — prepares app directory for packaging
tasks.register('distribution') {
    description = 'Prepare application directory for distribution'
    group = 'distribution'
    dependsOn jar, tasks.named('buildPlugins')

    doLast {
        def appDir = layout.buildDirectory.dir('app').get().asFile
        appDir.mkdirs()

        copy {
            from jar.archiveFile
            into appDir
        }
        copy {
            from layout.buildDirectory.dir('plugins')
            into "${appDir}/plugins"
        }
        copy {
            from 'images'
            into "${appDir}/images"
        }
        copy {
            from 'data/fingerprint'
            into "${appDir}/data/fingerprint"
        }
        copy {
            from('data') {
                include '*.csv'
            }
            into "${appDir}/data"
        }
    }
}

// jpackage task — creates platform-native installer/app-image
tasks.register('jpackage', Exec) {
    description = 'Create a platform-native application image using jpackage'
    group = 'distribution'
    dependsOn tasks.named('distribution')

    doFirst {
        def appDir = layout.buildDirectory.dir('app').get().asFile
        def outputDir = layout.buildDirectory.dir('jpackage').get().asFile
        outputDir.mkdirs()

        def jarFile = jar.archiveFile.get().asFile

        commandLine 'jpackage',
            '--type', 'app-image',
            '--name', 'GRASSMARLIN',
            '--app-version', project.version,
            '--vendor', 'NSA',
            '--input', appDir.absolutePath,
            '--main-jar', jarFile.name,
            '--main-class', 'util.Launcher',
            '--dest', outputDir.absolutePath,
            '--java-options', '--add-opens=javafx.graphics/com.sun.glass.ui=ALL-UNNAMED',
            '--java-options', '--add-exports=javafx.graphics/com.sun.javafx.sg.prism=ALL-UNNAMED'
    }
}
